  <text x="224" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#FEF2F2" fill-opacity="0.88">A curated directory of workflow, CI/CD, infrastructure, data and AI automation tools.</text>
