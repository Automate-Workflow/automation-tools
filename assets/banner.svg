    <circle cx="960" cy="130" r="4"/>
    <circle cx="940" cy="205" r="4"/>
    <circle cx="1150" cy="80" r="4"/>
    <circle cx="1145" cy="170" r="4"/>
  </g>
  <circle cx="1160" cy="100" r="5" fill="#F59E0B" fill-opacity="0.55"/>

  <!-- Left geometric flow mark -->
  <rect x="48" y="62" width="136" height="136" rx="24" fill="#1A0A0A" stroke="#B91C1C" stroke-width="2.5"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 78 130 C 94 130, 96 96, 114 96" stroke="#DC2626" stroke-width="4"/>
    <path d="M 78 130 C 94 130, 96 164, 114 164" stroke="#DC2626" stroke-width="4"/>
    <path d="M 118 96 C 136 96, 138 130, 154 130" stroke="#FEF2F2" stroke-width="3.5" stroke-opacity="0.9"/>
    <path d="M 118 164 C 136 164, 138 130, 154 130" stroke="#FEF2F2" stroke-width="3.5" stroke-opacity="0.9"/>
  </g>
  <circle cx="76" cy="130" r="10" fill="#1A0A0A" stroke="#FEF2F2" stroke-width="3.5"/>
  <circle cx="116" cy="96" r="9" fill="#DC2626" stroke="#FEF2F2" stroke-width="2.5"/>
  <circle cx="116" cy="164" r="9" fill="#DC2626" stroke="#FEF2F2" stroke-width="2.5"/>
  <circle cx="156" cy="130" r="10" fill="#F59E0B" stroke="#FEF2F2" stroke-width="2.5"/>

  <!-- Title and tagline -->
  <text x="224" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#F59E0B">CURATED OPEN DIRECTORY</text>
  <text x="224" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#FEF2F2">Automate-Workflow <tspan fill="#DC2626">/</tspan> automation-tools</text>
  <line x1="224" y1="148" x2="480" y2="148" stroke="url(#accent-line)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="492" cy="148" r="4" fill="#F59E0B"/>
  <text x="224" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#FEF2F2" fill-opacity="0.88">A curated directory of workflow, CI/CD, infrastructure, data and AI automation tools.</text>
